<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Download Photo | Kidversa Studio</title>
  <link rel="icon" href="icon.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --purple: #5c2e8a;
      --purple-dark: #4a2372;
      --orange: #f09822;
      --orange-dark: #d17c15;
      --white: #ffffff;
      --gray-50: #fafafa;
      --gray-100: #f5f5f5;
      --gray-200: #e5e5e5;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-900: #111827;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.03);
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 6px 12px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 12px 24px rgba(0, 0, 0, 0.06);
      --shadow-xl: 0 20px 40px rgba(0, 0, 0, 0.08);
      --radius-sm: 10px;
      --radius: 16px;
      --radius-md: 22px;
      --radius-xl: 32px;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f8f9fb;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: radial-gradient(circle at 10% 90%, rgba(92,46,138,0.03) 0%, transparent 40%), radial-gradient(circle at 90% 10%, rgba(240,152,34,0.03) 0%, transparent 40%);
    }
    .container {
      background: var(--white);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: contain;
      background: var(--white);
      box-shadow: var(--shadow-sm);
    }
    .logo-row h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--gray-900);
    }
    .logo-row h1 span {
      color: var(--purple);
    }
    .photo-wrapper {
      position: relative;
      width: 100%;
      max-width: 280px;
      margin: 0 auto 24px;
      aspect-ratio: 7.2 / 15;
      background: #f0f0f0;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: 0 0 0 4px var(--white), 0 0 0 8px rgba(92,46,138,0.1), 0 16px 40px rgba(0,0,0,0.1);
    }
    .photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .loading-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border: 4px solid var(--gray-200);
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    .photo-wrapper.loading .loading-spinner {
      display: block;
    }
    .photo-wrapper.loading img {
      opacity: 0.3;
    }
    .info-text {
      color: var(--gray-500);
      font-size: 0.9rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 18px 28px;
      background: linear-gradient(135deg, var(--purple), var(--purple-dark));
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.1rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: 0 10px 28px rgba(92,46,138,0.3);
      letter-spacing: 0.5px;
    }
    .download-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 40px rgba(92,46,138,0.4);
    }
    .download-btn:active {
      transform: scale(0.96);
    }
    .download-btn i {
      font-size: 1.3rem;
    }
    .error-message {
      display: none;
      background: #fee2e2;
      color: #dc2626;
      padding: 16px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .footer {
      margin-top: 20px;
      font-size: 0.75rem;
      color: var(--gray-400);
    }
    .footer a {
      color: var(--purple);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-row">
      <img src="icon.png" alt="Logo" class="logo" onerror="this.style.display='none'">
      <h1>Kidversa <span>Studio</span></h1>
    </div>

    <div class="error-message" id="errorMessage">
      <i class="fas fa-exclamation-circle"></i> Photo not found
    </div>

    <div class="photo-wrapper" id="photoWrapper">
      <div class="loading-spinner"></div>
      <img id="photoImage" src="" alt="Your Photo">
    </div>

    <p class="info-text">Your photo is ready to download. Click the button below to save it to your device.</p>

    <a href="#" class="download-btn" id="downloadBtn" download>
      <i class="fas fa-download"></i>
      <span>Download Photo</span>
    </a>

    <div class="footer">
      Powered by <a href="/">Kidversa Studio</a>
    </div>
  </div>

  <script>
    (function() {
      const photoImage = document.getElementById('photoImage');
      const photoWrapper = document.getElementById('photoWrapper');
      const downloadBtn = document.getElementById('downloadBtn');
      const errorMessage = document.getElementById('errorMessage');

      function getFilenameFromUrl() {
        const path = window.location.pathname;
        const segments = path.split('/');
        return segments[segments.length - 1];
      }

      function init() {
        const filename = getFilenameFromUrl();
        
        if (!filename || filename === 'download' || filename === '') {
          showError();
          return;
        }

        const photoUrl = `/photos/${filename}`;
        const downloadUrl = `/download/${filename}`;

        photoWrapper.classList.add('loading');
        photoImage.src = photoUrl;
        
        photoImage.onload = function() {
          photoWrapper.classList.remove('loading');
          downloadBtn.href = downloadUrl;
        };

        photoImage.onerror = function() {
          showError();
        };

        downloadBtn.addEventListener('click', function(e) {
          if (!downloadBtn.href || downloadBtn.href === '#') {
            e.preventDefault();
            showError();
          }
        });
      }

      function showError() {
        photoWrapper.style.display = 'none';
        downloadBtn.style.display = 'none';
        errorMessage.style.display = 'block';
        document.querySelector('.info-text').style.display = 'none';
      }

      init();
    })();
  </script>
</body>
</html>
