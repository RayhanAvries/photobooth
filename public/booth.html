<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Capture | Kidversa Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{--purple:#5c2e8a;--purple-dark:#4a2372;--purple-light:#8b5fc0;--orange:#f09822;--orange-dark:#d17c15;--white:#fff;--gray-50:#f8f9fb;--gray-100:#f1f3f5;--gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;--gray-900:#111827;--radius:16px;--radius-lg:24px;--shadow:0 4px 16px rgba(0,0,0,.06);--shadow-lg:0 8px 32px rgba(0,0,0,.08);--transition:.3s cubic-bezier(.4,0,.2,1)}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--gray-50);height:100vh;height:100dvh;width:100vw;width:100dvw;overflow:hidden;display:flex;align-items:center;justify-content:center}
    .main-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
    .screen{display:none;width:100%;height:100%;animation:screenIn .5s cubic-bezier(.4,0,.2,1)}
    .screen.active{display:flex}
    @keyframes screenIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
    .booth-layout{display:flex;width:100%;height:100%;background:var(--white);position:relative;overflow:hidden}
    @media(orientation:portrait){.booth-layout{flex-direction:column}}
    @media(orientation:landscape){.booth-layout{flex-direction:row}}
    .back-home-btn{position:absolute;top:16px;left:16px;z-index:50;display:flex;align-items:center;gap:8px;padding:12px 20px;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);border-radius:50px;color:#fff;text-decoration:none;font-weight:700;font-size:.95rem;transition:all var(--transition);box-shadow:0 4px 20px rgba(0,0,0,.15);cursor:pointer}
    .back-home-btn:hover{background:var(--purple);transform:translateY(-2px);box-shadow:0 8px 30px rgba(92,46,138,.3)}
    .back-home-btn:active{transform:scale(.95)}
    @media(max-width:480px){.back-home-btn{top:12px;left:12px;padding:10px 16px;font-size:.85rem;gap:8px}}
    .camera-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#e8ecf0 0%,#d5d9de 100%);min-width:0;min-height:0;padding:12px;gap:12px;position:relative}
    .camera-stage{position:relative;background:#000;border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 0 0 4px var(--white),0 0 0 8px rgba(92,46,138,.08),0 20px 60px rgba(0,0,0,.15);width:78%;max-width:360px;aspect-ratio:7.2/15;transition:all var(--transition)}
    @media(orientation:landscape){.camera-stage{width:auto;max-width:none;height:70vh;max-height:550px;aspect-ratio:7.2/15}}
    @media(max-width:480px){.camera-stage{width:85%;max-width:320px}}
    video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:0;pointer-events:none}
    #liveCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2}
    #frameOverlay{position:absolute;inset:0;pointer-events:none;z-index:6}
    #frameOverlay img{width:100%;height:100%;object-fit:fill}
    .countdown-overlay{position:absolute;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:10;border-radius:var(--radius-lg)}
    .countdown-number{font-size:clamp(6rem,15vw,10rem);font-weight:900;color:#fff;text-shadow:0 0 60px rgba(240,152,34,.9),0 0 120px rgba(240,152,34,.5);animation:countBounce .9s cubic-bezier(.4,0,.2,1)}
    @keyframes countBounce{0%{transform:scale(.2) rotate(-10deg);opacity:0}50%{transform:scale(1.2) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
    .capture-btn-inline{display:none;width:80%;max-width:380px;min-width:200px;padding:18px 32px;font-size:1.15rem;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;color:#fff;background:linear-gradient(135deg,var(--orange),var(--orange-dark));border:none;border-radius:50px;cursor:pointer;transition:all var(--transition);letter-spacing:.5px;box-shadow:0 8px 28px rgba(240,152,34,.4);z-index:1;position:relative;overflow:hidden}
    .capture-btn-inline::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transition:left .5s ease}
    .capture-btn-inline:hover::before{left:100%}
    .capture-btn-inline:hover{transform:translateY(-3px);box-shadow:0 16px 44px rgba(240,152,34,.5)}
    .capture-btn-inline:active{transform:scale(.96)}
    .capture-btn-inline:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
    .capture-btn-inline i{margin-right:10px}
    @media(orientation:portrait){.capture-btn-inline{display:block}}
    .sidebar{display:flex;background:var(--white);border-left:1px solid var(--gray-200);flex-shrink:0;padding:20px 18px;gap:16px;flex-direction:row}
    @media(orientation:portrait){.sidebar{flex-direction:column;width:100%;height:auto;border-left:none;border-top:1px solid var(--gray-200);padding:14px 16px;align-items:stretch;gap:12px;overflow-y:auto;max-height:38vh}}
    @media(orientation:landscape){.sidebar{flex-direction:column;width:230px;height:100%;padding:24px 18px;justify-content:center;gap:20px}}
    .sidebar-section{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;flex-shrink:0}
    @media(orientation:portrait){.sidebar-section{align-items:stretch;gap:6px}}
    .sidebar-label{font-size:.7rem;font-weight:800;color:var(--gray-400);text-transform:uppercase;letter-spacing:2.5px;white-space:nowrap;text-align:center}
    .frame-list-wrapper{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;display:flex;justify-content:center;padding:4px 0}
    .frame-list-wrapper::-webkit-scrollbar{display:none}
    .frame-list{display:flex;gap:14px;padding:4px 2px;flex-wrap:nowrap;justify-content:center}
    @media(orientation:landscape){.frame-list{flex-wrap:wrap;justify-content:center}}
    .frame-item{flex-shrink:0;width:64px;height:134px;border-radius:var(--radius-sm);cursor:pointer;transition:all var(--transition);background:var(--gray-100);overflow:hidden;border:3px solid transparent;position:relative;display:flex;flex-direction:column;align-items:center}
    .frame-item:hover{transform:translateY(-4px) scale(1.04);box-shadow:var(--shadow)}
    .frame-item.active{border-color:var(--orange);box-shadow:0 0 0 4px rgba(240,152,34,.25),var(--shadow);transform:translateY(-4px)}
    .frame-item img{width:100%;height:100%;object-fit:cover}
    .frame-item .frame-name{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.75);color:#fff;font-size:.55rem;font-weight:700;padding:3px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;letter-spacing:.3px}
    .frame-item.none{display:flex;align-items:center;justify-content:center;background:var(--gray-200);color:var(--gray-500);font-size:.65rem;font-weight:700;text-align:center;line-height:1.2;padding:4px;min-height:134px}
    .frame-item.none.active{border-color:var(--gray-400);box-shadow:0 0 0 4px rgba(156,163,175,.2)}
    .frame-item.none .frame-name{display:none}
    .filter-list{display:flex;gap:8px;width:100%}
    @media(orientation:landscape){.filter-list{flex-direction:column;gap:8px;width:100%}}
    @media(orientation:portrait){.filter-list{justify-content:center}}
    .filter-btn{padding:12px 20px;border-radius:50px;border:2px solid var(--gray-200);background:var(--white);cursor:pointer;font-weight:700;font-size:.85rem;color:var(--gray-600);transition:all var(--transition);text-align:center;white-space:nowrap;letter-spacing:.3px;flex:1;min-height:48px}
    .filter-btn:hover{border-color:var(--purple);background:var(--gray-50);color:var(--purple);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
    .filter-btn.active{background:var(--purple);color:#fff;border-color:var(--purple);box-shadow:0 4px 14px rgba(92,46,138,.3)}
    .capture-btn-sidebar{padding:16px 24px;font-size:1rem;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;color:#fff;background:linear-gradient(135deg,var(--orange),var(--orange-dark));border:none;border-radius:50px;cursor:pointer;transition:all var(--transition);letter-spacing:.5px;box-shadow:0 8px 28px rgba(240,152,34,.35);width:100%;position:relative;overflow:hidden;min-height:56px}
    .capture-btn-sidebar::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transition:left .5s ease}
    .capture-btn-sidebar:hover::before{left:100%}
    .capture-btn-sidebar:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(240,152,34,.5)}
    .capture-btn-sidebar:active{transform:scale(.97)}
    .capture-btn-sidebar:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
    .capture-btn-sidebar i{margin-right:10px}
    @media(orientation:portrait){.capture-btn-sidebar{display:none}}
    .cooldown-bar{position:absolute;bottom:-4px;left:0;height:4px;background:linear-gradient(90deg,var(--orange),var(--orange-dark));border-radius:0 0 4px 4px;transition:width .1s linear;width:0%;z-index:15;opacity:0}
    .cooldown-bar.active{opacity:1}
    .preview-layout{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;width:100%;height:100%;background:linear-gradient(180deg,var(--white) 0%,var(--gray-50) 100%);padding:28px 20px}
    .preview-canvas-wrap{height:60vh;height:60dvh;max-height:520px;aspect-ratio:7.2/15;background:var(--gray-100);border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 0 0 4px var(--white),0 0 0 8px rgba(92,46,138,.06),0 20px 60px rgba(0,0,0,.1)}
    .preview-canvas-wrap canvas{width:100%;height:100%;display:block}
    .action-btns{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
    .action-btns button{padding:18px 48px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;font-size:1.1rem;border-radius:50px;border:none;cursor:pointer;transition:all var(--transition);letter-spacing:.3px;min-width:160px}
    .retake-btn{background:var(--white);color:var(--purple);border:2px solid var(--purple)!important}
    .retake-btn:hover{background:var(--purple);color:#fff;transform:translateY(-2px);box-shadow:0 8px 24px rgba(92,46,138,.25)}
    .finish-btn{background:var(--purple);color:#fff;box-shadow:0 8px 24px rgba(92,46,138,.3)}
    .finish-btn:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(92,46,138,.4)}
    .action-btns button:active{transform:scale(.96)}
    @media(max-width:480px){.action-btns button{padding:16px 32px;font-size:1rem;min-width:120px}}
    .result-layout{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:linear-gradient(180deg,var(--white) 0%,var(--gray-50) 100%);padding:20px}
    .result-card{display:flex;gap:32px;align-items:center;justify-content:center;max-width:900px;width:100%}
    @media(orientation:portrait){.result-card{flex-direction:column;gap:20px;align-items:center}}
    @media(orientation:landscape){.result-card{flex-direction:row;gap:32px;align-items:center}}
    .result-photo-col{flex-shrink:0;height:62vh;height:62dvh;max-height:540px;aspect-ratio:7.2/15;background:var(--gray-100);border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 0 0 4px var(--white),0 0 0 8px rgba(92,46,138,.06),0 20px 60px rgba(0,0,0,.1)}
    .result-photo-col canvas{width:100%;height:100%;display:block}
    .result-info-col{flex:1;min-width:200px;max-width:320px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
    @media(orientation:portrait){.result-info-col{max-width:100%;width:100%;padding:0 20px}}
    .result-title-row{display:flex;align-items:center;gap:12px}
    .result-logo{width:36px;height:36px;border-radius:50%;object-fit:contain;background:var(--white);box-shadow:var(--shadow-sm)}
    .result-info-col h3{font-size:1.4rem;font-weight:800;color:var(--gray-900);white-space:nowrap}
    @media(max-width:480px){.result-info-col h3{font-size:1.2rem}}
    .qr-section{background:var(--gray-50);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid var(--gray-200);width:100%;transition:all var(--transition)}
    .qr-section:hover{border-color:var(--purple-light);box-shadow:var(--shadow)}
    #qrcode{display:inline-block;padding:10px;background:#fff;border-radius:var(--radius-sm);box-shadow:var(--shadow-sm)}
    #qrcode img,#qrcode canvas{width:150px!important;height:150px!important}
    @media(max-width:480px){#qrcode img,#qrcode canvas{width:130px!important;height:130px!important}}
    .qr-url{font-size:.6rem;color:var(--gray-400);word-break:break-all;max-width:100%;font-weight:500}
    .brightness-section{display:flex;flex-direction:column;gap:8px;width:100%}
    .brightness-label{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--gray-700);font-size:.85rem}
    .brightness-slider{width:100%;-webkit-appearance:none;height:8px;border-radius:10px;background:linear-gradient(90deg,#d1d5db,var(--orange));outline:none;transition:all var(--transition)}
    .brightness-slider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.2);border:3px solid var(--orange);transition:all var(--transition)}
    .brightness-slider::-webkit-slider-thumb:hover{transform:scale(1.1);box-shadow:0 4px 20px rgba(240,152,34,.4)}
    .brightness-slider::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;cursor:pointer;border:3px solid var(--orange)}
    .result-btns{display:flex;gap:10px;flex-wrap:wrap;width:100%;justify-content:center}
    .result-btns button,.result-btns a{flex:1;min-width:90px;padding:14px 18px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;font-size:.85rem;border-radius:50px;border:none;cursor:pointer;text-decoration:none;text-align:center;transition:all var(--transition);letter-spacing:.2px;white-space:nowrap}
    .btn-print{background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:#fff;box-shadow:0 6px 20px rgba(240,152,34,.3)}
    .btn-print:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(240,152,34,.4)}
    .btn-print:disabled{opacity:.6;cursor:not-allowed;transform:none!important}
    .btn-booth{background:var(--purple);color:#fff;box-shadow:0 6px 20px rgba(92,46,138,.25)}
    .btn-booth:hover{background:var(--purple-dark);transform:translateY(-2px);box-shadow:0 10px 30px rgba(92,46,138,.35)}
    .btn-home{background:var(--white);color:var(--gray-700);border:2px solid var(--gray-200)}
    .btn-home:hover{background:var(--gray-50);border-color:var(--gray-300);transform:translateY(-2px)}
    .result-btns button:active,.result-btns a:active{transform:scale(.96)}
    .toast-container{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;width:90%;max-width:500px}
    .toast{background:var(--gray-900);color:#fff;padding:16px 28px;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.2);font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:14px;opacity:0;transform:translateY(20px) scale(.95);transition:all .3s cubic-bezier(.4,0,.2,1);pointer-events:auto;max-width:90%;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.05)}
    .toast.show{opacity:1;transform:translateY(0) scale(1)}
    .toast.success{background:#065f46;border-color:#34d399}
    .toast.error{background:#7f1d1d;border-color:#f87171}
    .toast .icon{font-size:1.5rem;flex-shrink:0}
    @media(max-height:600px){.camera-stage{width:60%;max-width:240px}.sidebar{padding:10px 12px;gap:8px}.frame-item{width:52px;height:110px}.filter-btn{padding:10px 14px;font-size:.75rem}.capture-btn-inline{padding:14px 24px;font-size:1rem;min-width:160px}.capture-btn-sidebar{padding:12px 18px;font-size:.85rem}}
    @media(max-width:360px){.camera-stage{width:72%;max-width:220px}.frame-item{width:48px;height:100px}.filter-btn{padding:8px 12px;font-size:.7rem}.sidebar-label{font-size:.6rem;letter-spacing:2px}}
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:var(--gray-100)}
    ::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:10px}
    ::-webkit-scrollbar-thumb:hover{background:var(--gray-400)}
  </style>
</head>
<body>
<div class="main-container">
  <div class="screen active" id="boothScreen">
    <div class="booth-layout">
      <a href="/" class="back-home-btn" id="backHomeBtn"><i class="fas fa-arrow-left"></i><span>Home</span></a>
      <div class="camera-area">
        <div class="camera-stage" id="cameraWrapper">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="liveCanvas"></canvas>
          <div id="frameOverlay"><img id="frameOverlayImg" src="" alt="" style="display:none;"></div>
          <div class="countdown-overlay" id="countdownOverlay"><span class="countdown-number" id="countdownNumber">5</span></div>
          <div class="cooldown-bar" id="cooldownBar"></div>
        </div>
        <button class="capture-btn-inline" id="captureBtnInline" onclick="startCountdown()"><i class="fas fa-camera"></i> Capture</button>
      </div>
      <div class="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-label" id="framesLabel">Frames</div>
          <div class="frame-list-wrapper"><div class="frame-list" id="frameList"><div class="frame-item none active" data-frame-id="" onclick="selectFrame(this,'',null)"><span>No</span></div></div></div>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-label" id="filterLabel">Filter</div>
          <div class="filter-list">
            <button class="filter-btn active" data-filter="none" onclick="setFilter('none',this)">None</button>
            <button class="filter-btn" data-filter="monochrome" onclick="setFilter('monochrome',this)">Mono</button>
          </div>
        </div>
        <button class="capture-btn-sidebar" id="captureBtnSidebar" onclick="startCountdown()"><i class="fas fa-camera"></i> Capture</button>
      </div>
    </div>
  </div>
  <div class="screen" id="previewScreen">
    <div class="preview-layout">
      <div class="preview-canvas-wrap"><canvas id="canvas"></canvas></div>
      <div class="action-btns">
        <button class="retake-btn" onclick="retake()">Retake</button>
        <button class="finish-btn" onclick="finish()">Continue</button>
      </div>
    </div>
  </div>
  <div class="screen" id="resultScreen">
    <div class="result-layout">
      <div class="result-card">
        <div class="result-photo-col"><canvas id="resultCanvas"></canvas></div>
        <div class="result-info-col">
          <div class="result-title-row"><img src="logo.png" alt="Logo" class="result-logo" onerror="this.style.display='none'"><h3 id="resultTitle">Your Photo is Ready</h3></div>
          <div class="qr-section"><div id="qrcode"></div><p class="qr-url" id="qrUrlText"></p></div>
          <div class="brightness-section"><div class="brightness-label"><span id="brightnessLabel">Brightness</span><span id="finalBrightnessVal">1.0</span></div><input type="range" class="brightness-slider" id="finalBrightness" min="0.5" max="2.0" step="0.05" value="1.0"></div>
          <div class="result-btns">
            <button class="btn-print" id="printBtn" onclick="printPhoto()"><i class="fas fa-print"></i> Print</button>
            <button class="btn-booth" onclick="backToBooth()"><i class="fas fa-camera"></i> New</button>
            <a href="/" class="btn-home"><i class="fas fa-home"></i> Home</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script>
  (function(){
    function showToast(m,t='success'){const c=document.getElementById('toastContainer');const a=document.createElement('div');a.className=`toast ${t}`;const i=t==='success'?'✅':'❌';a.innerHTML=`<span class="icon">${i}</span> ${m}`;c.appendChild(a);requestAnimationFrame(()=>a.classList.add('show'));setTimeout(()=>{a.classList.remove('show');setTimeout(()=>a.remove(),400)},3500)}
    const screens={booth:document.getElementById('boothScreen'),preview:document.getElementById('previewScreen'),result:document.getElementById('resultScreen')};
    const video=document.getElementById('video');const liveCanvas=document.getElementById('liveCanvas');const liveCtx=liveCanvas.getContext('2d',{willReadFrequently:true});const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');const resultCanvas=document.getElementById('resultCanvas');const resultCtx=resultCanvas.getContext('2d');const countdownOverlay=document.getElementById('countdownOverlay');const countdownNumber=document.getElementById('countdownNumber');const frameOverlayImg=document.getElementById('frameOverlayImg');const frameList=document.getElementById('frameList');const finalBrightness=document.getElementById('finalBrightness');const finalBrightnessVal=document.getElementById('finalBrightnessVal');const qrContainer=document.getElementById('qrcode');const qrUrlText=document.getElementById('qrUrlText');const captureBtnInline=document.getElementById('captureBtnInline');const captureBtnSidebar=document.getElementById('captureBtnSidebar');const cameraWrapper=document.getElementById('cameraWrapper');const cooldownBar=document.getElementById('cooldownBar');const printBtn=document.getElementById('printBtn');const backHomeBtn=document.getElementById('backHomeBtn');
    const framesLabel=document.getElementById('framesLabel');const filterLabel=document.getElementById('filterLabel');const resultTitle=document.getElementById('resultTitle');const brightnessLabel=document.getElementById('brightnessLabel');const filterBtns=document.querySelectorAll('.filter-btn');const retakeBtn=document.querySelector('.retake-btn');const finishBtn=document.querySelector('.finish-btn');
